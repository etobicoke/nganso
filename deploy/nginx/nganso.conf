# nginx site config for nganso.com — serves the static Astro build.
# Deploy target: rsync dist/ -> /var/www/nganso (see ../../deploy.sh + .deploy.env).
#
# Install on the server:
#   sudo cp nganso.conf /etc/nginx/sites-available/nganso.conf
#   sudo ln -sf /etc/nginx/sites-available/nganso.conf /etc/nginx/sites-enabled/nganso.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS (certbot rewrites this file to add the :443 block):
#   sudo certbot --nginx -d nganso.com -d www.nganso.com

server {
    listen 80;
    listen [::]:80;
    server_name nganso.com www.nganso.com;

    root /var/www/nganso;
    index index.html;

    # Astro static output: map /path -> /path/index.html, else 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted assets (Astro hashes filenames) — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/nganso.access.log;
    error_log  /var/log/nginx/nganso.error.log;
}
